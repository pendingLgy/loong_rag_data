[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-data"
dynamic = ["version"]
description = "历史文本数据导入与向量化管道"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["rag", "vector", "embedding"]
authors = [
  { name = "loong", email = "amzinglgy@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "PyYAML>=6.0.3",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
parsers = [
  "unstructured>=0.12",
  "spacy>=3.8.16",
  "zh_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.8.0/zh_core_web_sm-3.8.0-py3-none-any.whl",
  "zh_core_web_md @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_md-3.8.0/zh_core_web_md-3.8.0-py3-none-any.whl",
]
milvus = ["pymilvus>=2.3"]
epub = [
  "EbookLib>=0.20",
  "beautifulsoup4>=4.15.0"
]
pdf = [
  "pdfplumber==0.11.10"
]
word = [
  "python-docx>=1.0"
]

openai = ["openai>=3.26.0"]

ragas-eval = [
  "langchain-core>=1.7.0",
  "langchain-openai>=1.7.2",
  "langchain-google-community>=5.1.1",
  "langchain-community==0.4.1",
  "ragas>=0.4.3",
]
dev = [
  "pytest>=7.4",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "ruff>=0.1.9",
]

[project.urls]
Documentation = "https://github.com/pendingLgy/loong_rag_data#readme"
Issues = "https://github.com/pendingLgy/loong_rag_data/issues"
Source = "https://github.com/pendingLgy/loong_rag_data"

[tool.hatch.envs.default]
installer = "pip"
features = [
  "parsers",
  "openai",
  "dev",
]

[tool.hatch.envs.default.scripts]
test = "pytest"
types = "mypy src tests"
check = "ruff check src tests"
format = "ruff format src tests"


[tool.hatch.envs.rag_data_dev]
installer = "pip"
features = [
  "parsers",
  "milvus",
  "dev",
  "word",
  "pdf",
  "epub",
  "ragas-eval",
]

[tool.hatch.envs.rag_data_dev.scripts]
test = "pytest"
types = "mypy src tests"
check = "ruff check src tests"
format = "ruff format src tests"


[tool.hatch.version]
path = "src/rag_data/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "module"

markers = [
  "integration: 集成测试，默认跳过",
  "eval: 评分，默认跳过",
]

addopts = "-s -q -rs -m 'not integration'"
#addopts = "-s -q -rs -m 'integration'"
#addopts = "-s -q -rs -m 'eval'"

log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] [%(pathname)s:%(funcName)s() %(lineno)d] %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.mypy]
python_version = "3.8"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["rag_data", "tests"]
branch = true
parallel = true
omit = [
  "src/rag_data/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
