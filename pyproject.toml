[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-data"
dynamic = ["version"]
description = "历史文本数据导入与向量化管道"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["rag", "vector", "embedding"]
authors = [
  { name = "loong", email = "amzinglgy@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
]

[project.optional-dependencies]
parsers = [
  "unstructured>=0.12",
  "spacy>=3.7",
  "zh-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/zh_core_web_sm-3.7.0/zh_core_web_sm-3.7.0-py3-none-any.whl",
]
embedding = ["sentence-transformers>=2.5"]
loguru = ["loguru>=0.7"]
structlog = ["structlog>=24.1"]
epub = [
  "EbookLib>=0.20",
  "beautifulsoup4>=4.15.0"
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "mypy>=1.8",
  "ruff>=0.1.9",
]

[project.urls]
Documentation = "https://github.com/pendingLgy/loong_rag_data#readme"
Issues = "https://github.com/pendingLgy/loong_rag_data/issues"
Source = "https://github.com/pendingLgy/loong_rag_data"

[tool.hatch.envs.default]
features = [
  "parsers",
  "embedding",
  "loguru",
  "structlog",
  "epub",
  "dev",
]

[tool.hatch.envs.default.scripts]
test = "pytest"
types = "mypy src tests"
check = "ruff check src tests"
format = "ruff format src tests"


[tool.hatch.envs.rag_data_dev]
features = [
  "parsers",
  "embedding",
  "loguru",
  "structlog",
  "dev",
  "epub",
]

[tool.hatch.envs.rag_data_dev.scripts]
test = "pytest"
types = "mypy src tests"
check = "ruff check src tests"
format = "ruff format src tests"


[tool.hatch.version]
path = "src/rag_data/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_data"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-s -q -m 'not integration'"
markers = [
  "slow: 需要外部服务的集成测试，默认跳过",
  "integration: 真实调用外部服务的手工集成测试，默认跳过",
]

[tool.mypy]
python_version = "3.8"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
source_pkgs = ["rag_data", "tests"]
branch = true
parallel = true
omit = [
  "src/rag_data/__about__.py",
]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
